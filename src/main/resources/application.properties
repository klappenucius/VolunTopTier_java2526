spring.application.name=voluntoptier

# --- Database: the H2 file data/db.mv.db in the project folder ---
# The path is relative to the folder the app is started from (the project root in IntelliJ
# and with mvn spring-boot:run). AUTO_SERVER=TRUE lets the IntelliJ database console stay
# connected while the app runs.
spring.datasource.url=jdbc:h2:file:./data/db;AUTO_SERVER=TRUE
spring.datasource.username=KPENEZIC
# Read from the DB_PASSWORD environment variable - never commit the real password
spring.datasource.password=${DB_PASSWORD}

# Run schema.sql on every start (CREATE TABLE IF NOT EXISTS leaves existing tables alone)
spring.sql.init.mode=always
spring.h2.console.enabled=true

# --- Files required by the course (text login + binary change log) ---
voluntoptier.files.credentials=data/credentials.txt
voluntoptier.files.change-log=data/changeLog.dat

logging.level.com.voluntoptier=DEBUG
